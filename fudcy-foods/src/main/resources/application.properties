spring.application.name=fudcy-foods

spring.datasource.url=jdbc:mysql://localhost:3306/fudcy_foods
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=never
spring.servlet.multipart.max-request-size=1MB
spring.servlet.multipart.max-file-size=1MB

# JWT idle lifetime is 30 minutes. Provide JWT_SECRET in the environment for production.
app.jwt.secret=${JWT_SECRET:fudcy-foods-super-secret-key-for-jwt-signing-256-bit-minimum-entropy}
app.jwt.expiration-ms=1800000

# Bootstrap admin account
app.admin.email=${ADMIN_EMAIL:admin@fudcyfoods.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=${ADMIN_NAME:Fudcy Admin}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
